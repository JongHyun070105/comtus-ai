[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comtus-ai"
version = "0.2.1"
description = "Offline-first, read-only analysis tools for Com2uS Baseball V26"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
comtus-ai = "comtus_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
